
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Magic Circle</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>

<body>

    <a-scene hands id="scene">

        <a-gltf-model
            id="model"
            src="c_cyan.glb"
            animation-mixer="clip: MagicCircle_Loop"
            position="0 0.4 -3"
            rotation="-90 0 0"
            scale="2 2 2">
        </a-gltf-model>

        <a-plane
            id="cyan-panel"
            color="#80CBE8"
            opacity="0.8"
            width="0.7"
            height="0.35"
            rotation="-10 0 0"
            position="-1.2 -0.8 -2">

            <a-text
                value="CYAN"
                align="center"
                color="black"
                width="2"
                position="0 0 0.01">
            </a-text>

        </a-plane>

        <a-plane
            id="gold-panel"
            color="gold"
            opacity="0.8"
            width="0.7"
            height="0.35"
            rotation="-10 0 0"
            position="-0.4 -0.8 -2">

            <a-text
                value="GOLD"
                align="center"
                color="black"
                width="2"
                position="0 0 0.01">
            </a-text>

        </a-plane>

        <a-plane
            id="violet-panel"
            color="#A77BE8"
            opacity="0.8"
            width="0.7"
            height="0.35"
            rotation="-10 0 0"
            position="0.4 -0.8 -2">

            <a-text
                value="VIOLET"
                align="center"
                color="black"
                width="2"
                position="0 0 0.01">
            </a-text>

        </a-plane>

        <a-plane
            id="rose-panel"
            color="#E58FA8"
            opacity="0.8"
            width="0.7"
            height="0.35"
            rotation="-10 0 0"
            position="1.2 -0.8 -2">

            <a-text
                value="ROSE"
                align="center"
                color="black"
                width="2"
                position="0 0 0.01">
            </a-text>

        </a-plane>

        <a-camera position="0 0 0"></a-camera>

    </a-scene>


    <script>
        const scene = document.getElementById("scene");
        const model = document.getElementById("model");
        const cyanPanel = document.getElementById("cyan-panel");
        const goldPanel = document.getElementById("gold-panel");
        const violetPanel = document.getElementById("violet-panel");
        const rosePanel = document.getElementById("rose-panel");
        const circleSound = new Audio("circle.mp3");

        let wasCyanInside = false;
        let wasGoldInside = false;
        let wasVioletInside = false;
        let wasRoseInside = false;

        function changeCyan() {

            const inside = scene.components.hands.isPointOnEntity(8, cyanPanel);

            if (inside && !wasCyanInside) {

                model.setAttribute("src", "c_cyan.glb");

                circleSound.currentTime = 0;
                circleSound.play();
            }

            wasCyanInside = inside;
        }

        function changeGold() {

            const inside = scene.components.hands.isPointOnEntity(8, goldPanel);

            if (inside && !wasGoldInside) {

                model.setAttribute("src", "c_gold.glb");

                circleSound.currentTime = 0;
                circleSound.play();
            }

            wasGoldInside = inside;
        }

        function changeViolet() {

            const inside = scene.components.hands.isPointOnEntity(8, violetPanel);

            if (inside && !wasVioletInside) {

                model.setAttribute("src", "c_violet.glb");

                circleSound.currentTime = 0;
                circleSound.play();
            }

            wasVioletInside = inside;
        }

        function changeRose() {

            const inside = scene.components.hands.isPointOnEntity(8, rosePanel);

            if (inside && !wasRoseInside) {

                model.setAttribute("src", "c_rose.glb");

                circleSound.currentTime = 0;
                circleSound.play();
            }

            wasRoseInside = inside;
        }

        function changeMagicCircle() {

            if (!scene.components.hands) {
                return;
            }

            changeCyan();
            changeGold();
            changeViolet();
            changeRose();

        }

        scene.addEventListener("hand-result", changeMagicCircle);

    </script>

</body>
</html>
