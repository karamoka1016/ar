<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octahedron</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>
        AFRAME.registerComponent("change-color", {
            schema: {
                color: { type: "color" }
            },

            init: function () {
                this.el.addEventListener("click", () => {
                    this.el.setAttribute("color", this.data.color);
                });
            }
        });

        AFRAME.registerComponent("orbit", {
            schema: {
                center: { type: "selector" },
                radius: { type: "number", default: 3 },
                speed: { type: "number", default: 1 },
                offset: { type: "number", default: 0 }
            },

            tick: function (time) {
                const center = this.data.center.object3D.position;

                const angle =
                    time / 1000 * this.data.speed +
                    this.data.offset;

                const x =
                    center.x +
                    Math.cos(angle) * this.data.radius;

                const z =
                    center.z +
                    Math.sin(angle) * this.data.radius;

                this.el.object3D.position.set(x, 2, z);
            }
        });
    </script>
</head>

<body>

<a-scene
    background="color:#111122"
    shadow="type: pcfsoft">

    <a-sky color="#111122"></a-sky>

    <a-camera position="0 2 2">
        <a-cursor
            color="white"
            raycaster="objects: .clickable">
        </a-cursor>
    </a-camera>

    <a-light
        type="ambient"
        color="#6666aa"
        intensity="1">
    </a-light>

    <a-light
        type="point"
        color="cyan"
        intensity="2"
        distance="8"
        position="0 3 -3">
    </a-light>

    <a-light
        type="point"
        color="blue"
        intensity="1.5"
        distance="7"
        position="-3 2 -3">
    </a-light>

    <a-light
        type="point"
        color="purple"
        intensity="1.5"
        distance="7"
        position="3 2 -3">
    </a-light>

    <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="12"
        height="12"
        color="#17172b">
    </a-plane>

    <a-cylinder
        position="0 0.25 -3"
        radius="1.4"
        height="0.5"
        color="dimgray"
        shadow="cast:true; receive:true">
    </a-cylinder>

    <a-cylinder
        position="0 0.53 -3"
        radius="1.15"
        height="0.08"
        color="#202060">
    </a-cylinder>

    <a-torus
        position="0 0.5 -3"
        rotation="90 0 0"
        radius="3"
        radius-tubular="0.05"
        color="cyan">
    </a-torus>

    <a-torus
        position="0 0.58 -3"
        rotation="90 0 0"
        radius="1.1"
        radius-tubular="0.035"
        color="blue"
        animation="
            property:rotation;
            to:90 360 0;
            loop:true;
            easing:linear;
            dur:3000;
        ">
    </a-torus>

    <a-octahedron
        id="center"
        position="0 2 -3"
        radius="0.7"
        scale="1 2 1"
        color="blue"
        animation="
            property:position;
            to:0 2.5 -3;
            loop:true;
            dir:alternate;
            easing:easeInOutSine;
            dur:3000;
        "
        animation__rotation="
            property:rotation;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:1000;
        ">
    </a-octahedron>

    <a-octahedron
        class="clickable"
        radius="0.7"
        scale="1 2 1"
        color="blue"
        change-color="color:red"
        orbit="center:#center; radius:3; speed:1; offset:0"
        animation__rotation="
            property:rotation;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:1000;
        ">
    </a-octahedron>

    <a-octahedron
        class="clickable"
        radius="0.7"
        scale="1 2 1"
        color="blue"
        change-color="color:green"
        orbit="center:#center; radius:3; speed:1; offset:1.5708"
        animation__rotation="
            property:rotation;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:1000;
        ">
    </a-octahedron>

    <a-octahedron
        class="clickable"
        radius="0.7"
        scale="1 2 1"
        color="blue"
        change-color="color:yellow"
        orbit="center:#center; radius:3; speed:1; offset:3.1416"
        animation__rotation="
            property:rotation;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:1000;
        ">
    </a-octahedron>

    <a-octahedron
        class="clickable"
        radius="0.7"
        scale="1 2 1"
        color="blue"
        change-color="color:purple"
        orbit="center:#center; radius:3; speed:1; offset:4.7124"
        animation__rotation="
            property:rotation;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:1000;
        ">
    </a-octahedron>

</a-scene>

</body>
</html>
